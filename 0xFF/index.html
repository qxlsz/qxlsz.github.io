<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>0xFF</title>
    <meta name="description" content="0xFF live $1M paper book. Fake money. Real tape." />
    <meta property="og:title" content="0xFF" />
    <meta property="og:description" content="Follow-only $1M paper trader. Live book." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://qxlsz.github.io/0xFF/" />
    <meta property="og:image" content="https://qxlsz.github.io/0xFF/og.jpg" />
    <meta property="og:image:alt" content="0xFF experiments desk card" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="0xFF" />
    <meta name="twitter:description" content="Follow-only $1M paper trader. Live book." />
    <meta name="twitter:image" content="https://qxlsz.github.io/0xFF/og.jpg" />
    <meta name="twitter:image:alt" content="0xFF experiments desk card" />
    <meta name="twitter:site" content="@qxlsz" />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://qxlsz.github.io/0xFF/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #09090b;
        --bg-elev: #111114;
        --fg: #f4f1ea;
        --muted: #9a9891;
        --line: #2a2a30;
        --long: #6eab8a;
        --short: #d07070;
        --hold: #c4b58a;
        --radius: 16px;
        --safe-b: env(safe-area-inset-bottom, 0px);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--fg); }
      html { -webkit-font-smoothing: antialiased; }
      body {
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        line-height: 1.45;
        min-height: 100dvh;
      }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      a { color: var(--long); text-decoration: none; }
      :focus-visible { outline: 2px solid var(--long); outline-offset: 3px; }
      .app { max-width: 1080px; margin: 0 auto; padding: 0 1rem 5.5rem; }
      header.top {
        position: sticky; top: 0; z-index: 20;
        background: color-mix(in oklab, var(--bg) 92%, transparent);
        backdrop-filter: blur(12px);
        display: flex; align-items: center; justify-content: space-between;
        gap: 0.65rem; padding: 0.85rem 0 0.6rem;
      }
      .brand { display: flex; align-items: center; gap: 0.65rem; }
      .hex { width: 1.45rem; height: 1.45rem; }
      .kicker {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--long);
        margin: 0; font-weight: 500;
      }
      .clock {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.7rem; color: var(--muted);
        display: flex; align-items: center; justify-content: flex-end; gap: 0.4rem;
        min-width: 0; text-align: right; line-height: 1.25;
      }
      .live { width: 0.42rem; height: 0.42rem; border-radius: 99px; background: var(--long); box-shadow: 0 0 0 4px rgb(110 171 138 / 0.14); }
      .live.off { background: var(--muted); box-shadow: none; }
      nav.tabs { display: none; gap: 0.25rem; }
      nav.tabs button {
        height: 2.1rem; padding: 0 0.85rem; border-radius: 999px; color: var(--muted); font-size: 0.84rem;
      }
      nav.tabs button.on { background: var(--bg-elev); color: var(--fg); }
      .desk { display: grid; gap: 1.5rem; padding-top: 0.4rem; }
      .hero-label { font-size: 0.8rem; color: var(--muted); margin: 0; font-weight: 400; }
      h2.equity { font-weight: 500; }
      .equity {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: clamp(2.15rem, 7vw, 3.15rem);
        font-weight: 500; letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums; margin: 0.15rem 0 0;
      }
      .pnl { font-size: 0.92rem; font-variant-numeric: tabular-nums; margin: 0.35rem 0 0; }
      .up { color: var(--long); } .down { color: var(--short); }
      .chart-wrap { height: 320px; margin: 0.85rem -0.25rem 0; position: relative; }
      .chart-wrap svg { width: 100%; height: 100%; display: block; }
      .chart-hint { font-size: 0.75rem; color: var(--muted); margin: 0.45rem 0 0; font-variant-numeric: tabular-nums; }
      .ranges { display: flex; gap: 0.35rem; margin-top: 0.75rem; }
      .ranges button {
        flex: 1; height: 2.15rem; border-radius: 8px; font-size: 0.75rem; font-weight: 500; color: var(--muted);
      }
      .ranges button.on.up { background: var(--long); color: var(--bg); }
      .ranges button.on.down { background: var(--short); color: var(--bg); }
      .power {
        margin-top: 1.15rem; width: 100%;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0.95rem 1rem; background: var(--bg-elev); border-radius: var(--radius);
        text-align: left;
      }
      .power .lbl { font-size: 0.8rem; color: var(--muted); }
      .power .val { font-variant-numeric: tabular-nums; font-size: 1.05rem; margin-top: 0.1rem; }
      .chev { color: var(--muted); font-size: 1.1rem; }
      .section { margin-top: 1.75rem; }
      .section h2 { font-size: 1.05rem; font-weight: 500; margin: 0 0 0.15rem; }
      .row {
        display: flex; align-items: center; gap: 0.75rem;
        width: 100%; min-width: 0; padding: 0.8rem 0; border-bottom: 1px solid var(--line); text-align: left;
      }
      .mark {
        width: 2.5rem; height: 2.5rem; border-radius: 99px; flex: none;
        display: grid; place-items: center;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.68rem; font-weight: 500; letter-spacing: 0.02em;
      }
      .meta { min-width: 0; flex: 1; }
      .meta .name, .meta .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .meta .name { display: block; font-size: 0.95rem; font-weight: 500; }
      .meta .sub { display: block; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
      .spark { width: 72px; height: 32px; flex: none; }
      .px { text-align: right; min-width: 5.4rem; }
      .px .n { display: block; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
      .px .d { display: block; font-variant-numeric: tabular-nums; font-size: 0.75rem; }
      .muted { color: var(--muted); }
      .empty { color: var(--muted); font-size: 0.9rem; padding: 1.25rem 0; }
      .fill { display: grid; grid-template-columns: 5.8rem minmax(0, 1fr) auto; gap: 0.7rem; padding: 0.95rem 0; border-bottom: 1px solid var(--line); }
      .fill .side { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; padding-top: 0.2rem; }
      .fill .why { font-size: 0.92rem; }
      .fill .when { font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }
      .fill .notional { font-variant-numeric: tabular-nums; font-size: 0.9rem; }
      .acct { margin-top: 0.5rem; }
      .acct-row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.95rem 0; border-bottom: 1px solid var(--line); font-size: 0.95rem; }
      .acct-row dt { color: var(--muted); }
      .acct-row dd { margin: 0; font-variant-numeric: tabular-nums; }
      .note { color: var(--muted); font-size: 0.88rem; line-height: 1.5; margin: 1.25rem 0 0; max-width: 36rem; }
      .dock {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
        display: grid; grid-template-columns: repeat(4, 1fr);
        background: color-mix(in oklab, var(--bg) 94%, transparent);
        backdrop-filter: blur(14px);
        border-top: 1px solid var(--line);
        overflow: visible;
        padding: 0.4rem 0.5rem calc(0.55rem + var(--safe-b));
      }
      .dock button {
        height: 2.9rem; color: var(--muted); font-size: 0.72rem; display: grid; place-items: center;
        border-radius: 8px;
      }
      .dock button.on { color: var(--fg); }
      .sheet {
        position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / 0.62);
        display: none; align-items: flex-end; justify-content: center;
      }
      .sheet.on { display: flex; }
      .sheet .card {
        width: min(440px, 100%); background: var(--bg-elev);
        border-radius: 20px 20px 0 0;
        border-top: 1px solid var(--line);
        padding: 1.15rem max(1.15rem, env(safe-area-inset-right, 0px)) calc(1.4rem + var(--safe-b)) max(1.15rem, env(safe-area-inset-left, 0px));
        max-height: 86dvh; overflow: auto; overscroll-behavior: contain;
      }
      .sheet h3 { margin: 0; font-size: 1.35rem; font-weight: 500; }
      .sheet .big {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 2rem; letter-spacing: -0.04em; margin: 0.65rem 0 0.2rem;
        font-variant-numeric: tabular-nums;
      }
      .sheet .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-top: 1.1rem; }
      .sheet .cell { background: var(--bg); border-radius: 12px; padding: 0.8rem 0.9rem; }
      .sheet .cell dl { margin: 0; }
      .sheet .cell dt { font-size: 0.72rem; color: var(--muted); }
      .sheet .cell dd { margin: 0.2rem 0 0; font-variant-numeric: tabular-nums; }
      .done { margin-top: 1.1rem; width: 100%; height: 2.75rem; border-radius: 12px; background: var(--fg); color: var(--bg); font-weight: 500; }
      .done:focus, .done:focus-visible {
        outline: 3px solid var(--bg);
        outline-offset: -3px;
      }
      @media (min-width: 860px) {
        .app { padding-bottom: 2.5rem; }
        nav.tabs { display: flex; }
        .dock { display: none; }
        .desk { grid-template-columns: 1.2fr 0.9fr; align-items: start; gap: 2.4rem; padding-top: 0.8rem; }
        .chart-wrap { height: 400px; }
        .hold-col { position: sticky; top: 4.2rem; }
        .sheet { align-items: center; }
        .sheet .card { border-radius: 20px; border-top: 0; }
      }
      @media (max-width: 360px) {
        .spark { width: 52px; }
        .clock { font-size: 0.64rem; }
        .px { min-width: 4.8rem; }
        .row { gap: 0.55rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        .live { box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <svg class="hex" viewBox="0 0 100 100" aria-hidden="true">
            <polygon points="50,8 90,31 90,69 50,92 10,69 10,31" fill="#6eab8a" />
          </svg>
          <h1 class="kicker">0xFF</h1>
        </div>
        <nav class="tabs" id="tabs-desk" aria-label="Desk views"></nav>
        <p class="clock"><span class="live off" id="pulse" aria-hidden="true"></span><span id="session">NYSE</span></p>
      </header>

      <main id="root"><p class="empty">Loading the live book…</p></main>
    </div>
    <nav class="dock" id="dock" aria-label="Desk views"></nav>
    <div class="sheet" id="sheet"></div>
    <script src="./app.js" defer></script>
  </body>
</html>
